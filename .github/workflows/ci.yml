name: CI

# PR 上也要跑。此前只在 push 到 main 时检查，等于「合进去之后才知道坏了」——
# 而这套东西的多数约束（跨端一致、生成物新鲜度、包入口）恰恰是人眼看不出来的。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 连续推送时，只保留最新一次
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 每一步单列一个 step：CI 变红时能直接从步骤名看出是哪一类约束没过，
      # 不必翻日志。合成一条 && 串起来的话，红的永远是同一个名字。
      - name: 跨端一致性与生成物新鲜度
        run: npm run check:parity

      - name: 类型检查
        run: npm run typecheck

      - name: 共享逻辑单元测试
        run: npm test

      - name: 文档站构建
        run: npm run build

      # axe 要真浏览器，装一个 chromium；只装这一个，装全套要多花两分钟
      - name: 准备浏览器
        run: npx playwright install --with-deps chromium

      - name: 无障碍检查
        run: npm run check:a11y

      # 窄屏溢出在桌面上完全看不出来，只能靠真浏览器量
      - name: 窄屏自适应检查
        run: npm run check:responsive

      # 行长与撑高的空白只在宽屏上出现，上面那条窄屏检查永远查不到
      - name: 桌面版面检查
        run: npm run check:layout

      # 焦点看不见、或者掉进收起来的内容里，用鼠标完全察觉不到；axe 也查不出，
      # 它不模拟 Tab。这条要真按两千多次 Tab，跑得比别的检查久（约七分钟）
      - name: 键盘可用性检查
        run: npm run check:keyboard

      # 键盘走完那几条路径之后，结果得和鼠标一样：排序状态读得出来、
      # 收起不丢选择、键盘与菜单落到同一格、重试原地更新、未读线不被推走
      - name: 键盘路径抽检
        run: npm run check:keyboard-paths

      # 虚拟化被谁顺手去掉之后，页面照样能用、测试照样绿，只是慢十倍
      - name: 性能基线检查
        run: npm run check:perf

      - name: 账号与权限页面闭环
        run: npm run check:access

      - name: 公共网页导航与内容闭环
        run: npm run check:public

      - name: 帕累托口径与浏览器回归
        run: npm run check:pareto

      # 注册表一旦被绕过，画布上照样能画出节点，只是删了节点边还悬着
      - name: 节点注册表与属性检查器闭环
        run: npm run check:nodes

      # 开发机上没人会去打开系统的「减少动效」，漏掉那一半完全看不出来
      - name: 动效开关检查
        run: npm run check:motion

      # 包的入口只在使用方的项目里才会暴露问题，仓库内的 alias 与 paths 看不见，
      # 所以必须在 CI 里真构建一次并核对入口
      - name: 发布产物构建与入口核对
        run: npm run build:packages

      # 覆盖率最容易骗自己：页面上名字都在，其中几个组件早就渲染不出来了
      - name: Patterns Lab 覆盖
        run: npm run check:lab

      # 示例应用各自独立构建：一个坏了不该把其它几个拖下水，
      # 而「构建通过」也是门户上那些入口不是 404 的前提
      - name: ERP 与 Agent 第一版业务回归（含故障注入）
        run: npm run check:e2e

      - name: 站点包含全部可运行示例（含故障注入）
        run: node --test scripts/assemble-site.test.mjs && node scripts/assemble-site.mjs

      # 插画是仓库里唯一的二进制资产：少一张 @2x 或者素材里烤了底，
      # 静态检查全绿，只有 Retina 用户和深色主题用户看得到
      - name: 插画矩阵与素材
        run: npm run check:illustrations

      # 摇树失效不会让任何构建变红，只能打一遍再称重
      - name: 按需引入的体积
        run: node scripts/check-bundle.mjs

      # 顶层碰一下 document，使用方的 SSR 就会崩在 import 那一行，
      # 而本仓库是纯客户端的，怎么跑都看不出来
      - name: SSR 与 CSP 兼容性
        run: node scripts/check-ssr.mjs

      # 仓库内的 alias 与 tsconfig paths 让一切看起来正常，装到别人项目里才暴露。
      # 这一步把包 pack 出来，装进仓库外的干净项目，真的打包并在浏览器里渲染一次。
      - name: 外部安装烟测
        run: node scripts/check-install.mjs

      # 生成物是提交进仓库的。上面几步会重新生成它们，若与提交的内容不一致，
      # 说明改了源码却没跑生成脚本——这种漏掉不会让任何一步失败，只能这样兜住。
      - name: 生成物是否已提交
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::有生成物未提交，请在本地运行 npm run check:parity 后提交改动"
            git status --porcelain
            git diff
            exit 1
          fi
