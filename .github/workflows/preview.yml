name: Deploy branch preview

# 每个分支一份预览，地址是 <站点>/preview/<分支名>/。
#
# 为什么不是「所有分支都发到站点根目录」：一个仓库只有一个 Pages 站点，
# 那样做等于谁最后推谁说了算，main 随时会被一个调试分支盖掉，
# 而看站点的人无从知道自己看的是哪个分支。
#
# 子目录能直接用，是因为 vite.config.ts 里 base 是相对路径（`./`），
# 同一份构建产物放到任何路径下都能跑，不必为每个分支重新构建。
on:
  push:
    branches-ignore: [main]
  # 分支删掉时把它的预览一并清掉，否则预览会越攒越多，
  # 而且留着的是一份没人再维护的旧站点
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 分支名里的斜杠换成短横线：claude/foo → claude-foo。
      # 直接当路径用的话会多出一层目录，删除预览时还要递归找父目录空不空。
      - name: 算出预览目录
        id: slug
        run: |
          raw="${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}"
          echo "dir=preview/$(echo "$raw" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "branch=$raw" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: github.event_name != 'delete'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event_name != 'delete'
      - run: npm run build:site
        if: github.event_name != 'delete'

      - name: 发布预览
        if: github.event_name != 'delete'
        env:
          TARGET: ${{ steps.slug.outputs.dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-pages.sh

      - name: 分支已删除，清掉它的预览
        if: github.event_name == 'delete'
        env:
          TARGET: ${{ steps.slug.outputs.dir }}
          REMOVE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-pages.sh

      - name: 写出预览地址
        if: github.event_name != 'delete'
        run: |
          echo "### 预览已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.slug.outputs.dir }}/>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "分支：\`${{ steps.slug.outputs.branch }}\`（首次发布后可能要等一两分钟 Pages 才刷新）" >> "$GITHUB_STEP_SUMMARY"
